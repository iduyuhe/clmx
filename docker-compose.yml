version: '3.8'

# ====================================
# CLMX — 开发/部署编排
#
# 最小启动：docker-compose up postgres
# 完整启动：docker-compose --profile full up
# 应用构建：docker-compose up --build
# ====================================

services:
  # ── 数据库 ──
  postgres:
    image: postgres:16-alpine
    container_name: clmx_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-clmx_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 后端 API ──
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: clmx_server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-clmx_dev}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      UPLOAD_DIR: /app/uploads
      REMOTE_TRAINING_URL: ${REMOTE_TRAINING_URL:-}
      REMOTE_INFERENCE_URL: ${REMOTE_INFERENCE_URL:-}
    ports:
      - "${SERVER_PORT:-3002}:3002"
    volumes:
      - server_uploads:/app/uploads
      - server_checkpoints:/app/checkpoints
      - server_logs:/app/logs
    restart: unless-stopped
    profiles: [full]

  # ── 前端 ──
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: clmx_client
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-80}:80"
    restart: unless-stopped
    profiles: [full]

  # ── Redis — 预留（未来用于缓存、速率限制持久化、队列） ──
  redis:
    image: redis:7-alpine
    container_name: clmx_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles: [full]

  # ── MinIO — 预留（未来用于对象存储） ──
  minio:
    image: minio/minio:RELEASE.2025-06-20T04-37-42Z
    container_name: clmx_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    profiles: [full]

volumes:
  postgres_data:
  server_uploads:
  server_checkpoints:
  server_logs:
  redis_data:
  minio_data:
