name: "🐛 Bug 反馈"
description: 报告一个可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: desc
    attributes:
      label: 缺陷描述
      description: 清晰、简洁地描述问题。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 让我能稳定复现的最小步骤。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 含报错信息 / 日志片段。
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: 操作系统 / Node 版本 / 数据库 / 部署方式
  - type: checkboxes
    id: privacy
    attributes:
      label: 安全确认
      options:
        - label: 本问题不含密钥、凭证或个人敏感信息
          required: true
