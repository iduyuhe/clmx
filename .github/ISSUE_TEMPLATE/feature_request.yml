name: "✨ 功能建议"
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个需求来自什么痛点？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: 备选方案
      description: 是否考虑过其他做法？
  - type: textarea
    id: context
    attributes:
      label: 补充上下文
